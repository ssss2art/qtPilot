name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs needs full history + tags to derive the version

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare release archives
        shell: bash
        run: |
          mkdir -p release

          # Extract probe + launcher for each Qt version, platform, and
          # architecture, then package into per-(qt_version, platform, arch)
          # archives.
          for dir in artifacts/qtpilot-*/; do
            basename=$(basename "$dir")

            # Determine platform from preset name
            if [[ "$basename" == *"windows"* ]]; then
              platform="windows"
            elif [[ "$basename" == *"macos"* ]]; then
              platform="macos"
            else
              platform="linux"
            fi

            # Determine architecture from artifact name
            if [[ "$basename" == *"x86_64"* ]]; then
              arch="x86_64"
            elif [[ "$basename" == *"x86"* ]]; then
              arch="x86"
            elif [[ "$basename" == *"arm64"* ]]; then
              arch="arm64"
            elif [ "$platform" = "macos" ]; then
              arch="arm64"
            else
              arch="x64"
            fi

            # Extract Qt version tag from directory name (e.g., qt5.15.2 -> qt5.15)
            qt_full=$(echo "$basename" | grep -oP 'qt\K[0-9]+\.[0-9]+\.[0-9]+')
            qt_tag="qt$(echo "$qt_full" | grep -oP '^[0-9]+\.[0-9]+')"

            # Stage files into a temp directory with simplified names
            staging="staging/${qt_tag}-${platform}-${arch}"
            mkdir -p "$staging"

            # Copy probe binary with simplified name (no version/compiler suffix)
            if [ "$platform" = "windows" ]; then
              for f in "$dir"/lib/qtPilot-probe-*.dll; do
                [ -f "$f" ] && cp "$f" "$staging/qtPilot-probe.dll"
              done
              for f in "$dir"/bin/qtPilot-launcher*; do
                [ -f "$f" ] && cp "$f" "$staging/qtPilot-launcher.exe"
              done
            elif [ "$platform" = "macos" ]; then
              for f in "$dir"/lib/libqtPilot-probe-*.dylib; do
                [ -f "$f" ] && cp "$f" "$staging/qtPilot-probe.dylib"
              done
              for f in "$dir"/bin/qtPilot-launcher*; do
                [ -f "$f" ] && cp "$f" "$staging/qtPilot-launcher"
              done
            else
              for f in "$dir"/lib/libqtPilot-probe-*.so; do
                [ -f "$f" ] && cp "$f" "$staging/qtPilot-probe.so"
              done
              for f in "$dir"/bin/qtPilot-launcher*; do
                [ -f "$f" ] && cp "$f" "$staging/qtPilot-launcher"
              done
            fi

            # Copy bundled test app (self-contained with Qt DLLs)
            if [ -d "$dir/testapp/" ]; then
              mkdir -p "$staging/testapp"
              cp -r "$dir/testapp/"* "$staging/testapp/"
            fi
          done

          # Create archives from staged directories.
          # Naming: Windows always gets -x64/-x86 suffix.
          #         Linux x64 has no suffix (backward compat); Linux x86 gets -x86.
          for staging_dir in staging/*/; do
            tag_platform_arch=$(basename "$staging_dir")
            qt_tag=$(echo "$tag_platform_arch" | grep -oP '^qt[0-9]+\.[0-9]+(-patched)?')
            platform=$(echo "$tag_platform_arch" | grep -oP '(windows|linux|macos)')
            arch=$(echo "$tag_platform_arch" | grep -oP '(x64|x86_64|x86|arm64)$')

            if [ "$platform" = "windows" ]; then
              archive="qtpilot-${qt_tag}-${platform}-${arch}.zip"
              (cd "$staging_dir" && zip -r "../../release/$archive" .)
            elif [ "$platform" = "macos" ]; then
              archive="qtpilot-${qt_tag}-macos-${arch}.tar.gz"
              tar -czf "release/$archive" -C "$staging_dir" .
            else
              if [ "$arch" = "x86" ]; then
                archive="qtpilot-${qt_tag}-${platform}-x86.tar.gz"
              else
                archive="qtpilot-${qt_tag}-${platform}.tar.gz"
              fi
              tar -czf "release/$archive" -C "$staging_dir" .
            fi
          done

          # Generate checksums over archive files only
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/qtpilot/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs needs full history + tags to derive the version

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: cd python && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/dist/
