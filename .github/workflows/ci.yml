name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      desktop_matrix: ${{ steps.select.outputs.desktop_matrix }}
      python_matrix: ${{ steps.select.outputs.python_matrix }}
      lint: ${{ steps.select.outputs.lint }}
      python: ${{ steps.select.outputs.python }}
      build: ${{ steps.select.outputs.build }}
      static_probe: ${{ steps.select.outputs.static_probe }}
      mobile: ${{ steps.select.outputs.mobile }}
      sanitizers: ${{ steps.select.outputs.sanitizers }}
      benchmarks: ${{ steps.select.outputs.benchmarks }}
      e2e: ${{ steps.select.outputs.e2e }}
      release: ${{ steps.select.outputs.release }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Select complete changed scope
        id: select
        run: python scripts/ci_policy.py plan
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "python/uv.lock"
      - name: Install policy-test dependencies from the lock
        working-directory: python
        run: uv sync --locked --extra dev --python 3.14
      - name: Verify selection and required-job behavior
        run: uv run --project python --no-sync pytest python/tests/test_ci_policy.py --noconftest -q

  lint:
    needs: plan
    if: needs.plan.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
        with:
          clang-format-version: "18"
          check-path: "src"

  # The static probe is the delivery mode used on Android and iOS: an archive
  # linked into an app rather than a library injected into one. It has failure modes
  # the shared build cannot have -- most importantly, the linker silently discarding
  # the archive member that registers the startup hook, which leaves an app that
  # builds and runs perfectly and simply has no probe in it. Nothing in the desktop
  # matrix can catch that, so it is checked here by linking a real consumer against
  # the INSTALLED package and asserting the probe actually started.
  static-probe:
    needs: [plan, build]
    if: needs.plan.outputs.static_probe == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { qt: "6.10.0", os: ubuntu-24.04, modules: "qtwebsockets" }
          - { qt: "6.10.0", os: macos-14,     modules: "qtwebsockets" }
          # Qt 5 too: the static path touches the export macro and the
          # whole-archive link option, neither of which is Qt6-specific.
          # (No Windows leg -- QTPILOT_PROBE_STATIC is refused there, see
          # CMakeLists.txt.)
          - { qt: "5.15.2", os: ubuntu-24.04, modules: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # One retry, because the Qt mirrors intermittently stall mid-download. The
      # step timeout is what turns a stall into a failure the retry can act on -- a
      # hang is not a failure, so without it `if: failure()` never fires and the job
      # sits until the job timeout.
      - name: Install Qt
        id: qt
        continue-on-error: true
        timeout-minutes: 15
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: ${{ matrix.qt }}
          modules: ${{ matrix.modules }}
          cache: true

      - name: Install Qt (retry)
        if: steps.qt.outcome == 'failure'
        timeout-minutes: 15
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: ${{ matrix.qt }}
          modules: ${{ matrix.modules }}
          cache: true

      - name: Install X11 dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxext-dev libxtst-dev libx11-dev

      - name: Build and install the static probe
        shell: bash
        run: |
          cmake -B build/static -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DQTPILOT_PROBE_STATIC=ON \
            -DQTPILOT_BUILD_TESTS=OFF \
            -DQTPILOT_BUILD_TEST_APP=OFF
          cmake --build build/static --parallel
          cmake --install build/static --prefix "$PWD/install/static"
          # An archive, not a shared library.
          ls install/static/lib/
          test -n "$(find install/static/lib -name '*.a' -o -name '*.lib' | head -1)"

      - name: Link a consumer against the installed package
        shell: bash
        run: |
          cmake -B build/consumer -S tests/static_consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install/static"
          cmake --build build/consumer --parallel

      - name: The linked probe must actually start
        shell: bash
        run: |
          # The consumer references no qtPilot symbol, so this passes only if the
          # whole-archive link option on the imported target kept the startup hook
          # from being discarded, AND the deferred initialization ran to completion.
          BIN="$(find build/consumer -name static_consumer -type f | head -1)"
          echo "Running $BIN"
          # Let the OS choose an unused port. A fixed port made this check depend
          # on unrelated processes on the runner, and `|| true` then hid a real
          # consumer failure.
          QT_QPA_PLATFORM=offscreen QTPILOT_PORT=0 "$BIN" > probe.log 2>&1
          cat probe.log
          # Object hooks are installed before WebSocketServer::start().  Treating
          # that earlier message as success allowed a probe whose socket failed to
          # bind to pass CI. The listening banner is emitted only after `listen()`
          # succeeds, so it proves both whole-archive retention and completed
          # deferred initialization.
          if ! grep -q "qtPilot listening on ws://" probe.log; then
            echo "::error::The statically linked probe did not reach its listening state."
            echo "::error::Its archive member may have been dropped, deferred init may"
            echo "::error::have failed, or WebSocketServer::start() could not bind."
            exit 1
          fi
          echo "Static probe initialized and listening correctly."

  # Cross-compile for the mobile targets. Compile-only: neither platform can run
  # host tests, and the probe reaches a device by being linked into an app rather
  # than deployed on its own. Without this, a mobile break is invisible until
  # somebody builds by hand.
  mobile:
    needs: [plan, build]
    if: needs.plan.outputs.mobile == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android, os: ubuntu-24.04, target: android, arch: android_arm64_v8a, qt: "6.10.0" }
          - { name: ios,     os: macos-14,     target: ios,     arch: "",                qt: "6.10.0" }
    name: mobile (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Mobile targets Qt latest (6.10.0) across Android and iOS. Each HOST install
      # shares a cache entry with the desktop build matrix (Ubuntu 6.10.0 and macOS 6.10.0)
      # while using Qt versions with official prebuilt packages on the target SDK.
      - name: Install host Qt
        id: hostqt
        continue-on-error: true
        timeout-minutes: 15
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: ${{ matrix.qt }}
          modules: qtwebsockets
          cache: true
          set-env: false
          dir: ${{ runner.temp }}/qt-host

      - name: Install host Qt (retry)
        if: steps.hostqt.outcome == 'failure'
        timeout-minutes: 15
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: ${{ matrix.qt }}
          modules: qtwebsockets
          cache: true
          set-env: false
          dir: ${{ runner.temp }}/qt-host

      - name: Install target Qt
        id: targetqt
        continue-on-error: true
        timeout-minutes: 15
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: ${{ matrix.qt }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          modules: qtwebsockets
          cache: true

      - name: Install target Qt (retry)
        if: steps.targetqt.outcome == 'failure'
        timeout-minutes: 15
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: ${{ matrix.qt }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          modules: qtwebsockets
          cache: true

      - name: Set up JDK (Android)
        if: matrix.name == 'android'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure and build
        shell: bash
        run: |
          HOST_QT="$(find "${{ runner.temp }}/qt-host" -maxdepth 3 -type d -name 'gcc_64' -o -maxdepth 3 -type d -name 'macos' | head -1)"
          echo "Host Qt: $HOST_QT"
          # qt-cmake from the TARGET kit selects the cross toolchain; ANDROID/IOS
          # being set is what switches qtPilot into mobile mode (static probe, no
          # launcher, no host tests).
          "$QT_ROOT_DIR/bin/qt-cmake" -B build/mobile -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$HOST_QT"
          cmake --build build/mobile --parallel
          find build/mobile -name '*.a' -print

  # Records the fitted complexity of the probe's hot paths in the run log, so a
  # change of exponent is visible in review instead of being discovered later.
  #
  # NON-BLOCKING on purpose (continue-on-error). The numbers are timing-derived and a
  # shared runner is noisy, so a hard assertion would teach people to re-run until
  # green -- which is worse than no check. What this gives you is a reviewable record:
  # the _BigO column lands in the step summary, and a jump from N to N^2 is obvious.
  benchmarks:
    needs: [plan, build]
    if: needs.plan.outputs.benchmarks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Qt
        id: qt
        continue-on-error: true
        timeout-minutes: 15
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: "6.10.0"
          modules: qtwebsockets
          cache: true

      - name: Install Qt (retry)
        if: steps.qt.outcome == 'failure'
        timeout-minutes: 15
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: "6.10.0"
          modules: qtwebsockets
          cache: true

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxext-dev libxtst-dev libx11-dev

      - name: Build benchmarks
        run: |
          cmake -B build/bench -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DQTPILOT_BUILD_BENCHMARKS=ON \
            -DQTPILOT_BUILD_TESTS=OFF \
            -DQTPILOT_BUILD_TEST_APP=OFF
          cmake --build build/bench --target qtPilot_bench_object_id --parallel

      - name: Measure complexity
        run: |
          BIN="$(find build/bench -name qtPilot_bench_object_id -type f | head -1)"
          # Short min-time: we want the fitted exponent, not a precise constant.
          QT_QPA_PLATFORM=minimal "$BIN" --benchmark_min_time=0.05s | tee bench.txt

          {
            echo "## Complexity (fitted Big-O)"
            echo
            echo "Read the exponent, not the constant. RMS above ~10% means the fit is"
            echo "untrustworthy on this runner -- treat it as no signal rather than a result."
            echo
            echo '```'
            grep -E "_BigO|_RMS" bench.txt || echo "(no complexity rows -- did a benchmark fail to run?)"
            echo '```'
            echo
            echo "Baseline and interpretation: \`benchmarks/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  sanitizers:
    needs: [plan, build]
    if: needs.plan.outputs.sanitizers == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: "asan-ubsan", name: "ASan + UBSan" }
          - { preset: "tsan",       name: "TSan" }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Qt
        id: qt
        continue-on-error: true
        timeout-minutes: 15
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: "6.10.0"
          modules: qtwebsockets
          cache: true

      - name: Install Qt (retry)
        if: steps.qt.outcome == 'failure'
        timeout-minutes: 15
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: "6.10.0"
          modules: qtwebsockets
          cache: true

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxext-dev libxtst-dev libx11-dev

      - name: Configure and build (${{ matrix.preset }})
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Run tests (${{ matrix.preset }})
        shell: bash
        run: |
          QT_QPA_PLATFORM=minimal QTPILOT_ENABLED=0 ctest --preset ${{ matrix.preset }} --output-on-failure

  build:
    needs: [plan, lint, python]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.build == 'true' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.python.result == 'success' || needs.python.result == 'skipped')
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Qt
        id: qt
        continue-on-error: true
        timeout-minutes: 15
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: ${{ matrix.qt }}
          modules: ${{ matrix.modules }}
          arch: ${{ matrix.arch || '' }}
          cache: true

      - name: Install Qt (retry)
        if: steps.qt.outcome == 'failure'
        timeout-minutes: 15
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: ${{ matrix.qt }}
          modules: ${{ matrix.modules }}
          arch: ${{ matrix.arch || '' }}
          cache: true

      - name: Install X11 dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxext-dev libxtst-dev libx11-dev

      - name: Configure
        shell: bash
        run: |
          # install-qt-action sets QT_ROOT_DIR on Linux and Qt5_DIR/Qt6_DIR variously.
          # Qt5_DIR and Qt6_DIR point to lib/cmake/Qt{5,6}/ — walk up to the prefix.
          if [ -n "$QT_ROOT_DIR" ]; then
            QT_PATH="$QT_ROOT_DIR"
          elif [ -n "$Qt6_DIR" ]; then
            QT_PATH="$(cd "$Qt6_DIR/../../.." && pwd)"
          elif [ -n "$Qt5_DIR" ]; then
            QT_PATH="$(cd "$Qt5_DIR/../../.." && pwd)"
          else
            echo "::error::No Qt path found in environment"
            exit 1
          fi
          echo "Using Qt prefix: $QT_PATH"
          cmake --preset ${{ matrix.preset }} -DCMAKE_PREFIX_PATH="$QT_PATH" ${{ matrix.extra_cmake }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -LE admin

      - name: Set up uv for real-probe E2E
        if: runner.os == 'Linux' && matrix.qt == '6.10.0' && !matrix.extra_cmake && needs.plan.outputs.e2e == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "python/uv.lock"

      - name: Execute required real-probe E2E
        if: runner.os == 'Linux' && matrix.qt == '6.10.0' && !matrix.extra_cmake && needs.plan.outputs.e2e == 'true'
        env:
          QTPILOT_TEST_BUILD_DIR: ${{ github.workspace }}/build/${{ matrix.preset }}
          QTPILOT_REQUIRE_E2E: "1"
        run: >-
          uv run --project python --locked --extra dev --python 3.14 pytest
          python/tests/test_replay_e2e.py python/tests/test_complicated_app_e2e.py
          python/tests/test_probe_handshake_e2e.py -v

      - name: Install
        if: needs.plan.outputs.release == 'true'
        shell: bash
        run: cmake --install build/${{ matrix.preset }} --prefix install/${{ matrix.preset }}

      - name: Bundle test app (Windows)
        if: runner.os == 'Windows' && needs.plan.outputs.release == 'true'
        shell: bash
        run: |
          PRESET="${{ matrix.preset }}"
          # Resolve Qt prefix (same logic as Configure step)
          if [ -n "$QT_ROOT_DIR" ]; then
            QT_PATH="$QT_ROOT_DIR"
          elif [ -n "$Qt6_DIR" ]; then
            QT_PATH="$(cd "$Qt6_DIR/../../.." && pwd)"
          elif [ -n "$Qt5_DIR" ]; then
            QT_PATH="$(cd "$Qt5_DIR/../../.." && pwd)"
          fi
          mkdir -p "install/$PRESET/testapp"
          cp "build/$PRESET/bin/Release/qtPilot-test-app.exe" "install/$PRESET/testapp/"
          # Copy launcher and probe into testapp so everything is self-contained
          cp "install/$PRESET/bin/qtPilot-launcher.exe" "install/$PRESET/testapp/" 2>/dev/null || true
          for f in "install/$PRESET/lib/"qtPilot-probe-*.dll; do
            [ -f "$f" ] && cp "$f" "install/$PRESET/testapp/qtPilot-probe.dll"
          done
          # Run windeployqt on both test app and probe to capture all Qt deps (incl. WebSockets)
          "$QT_PATH/bin/windeployqt.exe" --no-translations "install/$PRESET/testapp/qtPilot-test-app.exe"
          "$QT_PATH/bin/windeployqt.exe" --no-translations "install/$PRESET/testapp/qtPilot-probe.dll" 2>/dev/null || true
          echo "Test app bundle size:"
          du -sh "install/$PRESET/testapp/"

      - name: Bundle test app (Linux)
        if: runner.os == 'Linux' && needs.plan.outputs.release == 'true'
        shell: bash
        run: |
          PRESET="${{ matrix.preset }}"
          QT_MAJOR=$(echo "${{ matrix.qt }}" | cut -c1)
          if [ -n "$QT_ROOT_DIR" ]; then
            QT_PATH="$QT_ROOT_DIR"
          elif [ -n "$Qt6_DIR" ]; then
            QT_PATH="$(cd "$Qt6_DIR/../../.." && pwd)"
          elif [ -n "$Qt5_DIR" ]; then
            QT_PATH="$(cd "$Qt5_DIR/../../.." && pwd)"
          fi
          mkdir -p "install/$PRESET/testapp/lib" "install/$PRESET/testapp/plugins/platforms"
          cp "build/$PRESET/bin/qtPilot-test-app" "install/$PRESET/testapp/"
          # Copy launcher and probe into testapp so everything is self-contained
          cp "install/$PRESET/bin/qtPilot-launcher" "install/$PRESET/testapp/" 2>/dev/null || true
          for f in "install/$PRESET/lib/"libqtPilot-probe-*.so; do
            [ -f "$f" ] && cp "$f" "install/$PRESET/testapp/qtPilot-probe.so"
          done
          # Copy minimal Qt runtime (including WebSockets for the probe)
          for lib in libQt${QT_MAJOR}Core.so* libQt${QT_MAJOR}Gui.so* libQt${QT_MAJOR}Widgets.so* libQt${QT_MAJOR}Network.so* libQt${QT_MAJOR}WebSockets.so* libQt${QT_MAJOR}DBus.so* libQt${QT_MAJOR}XcbQpa.so* libicui18n.so* libicuuc.so* libicudata.so*; do
            find "$QT_PATH/lib" -name "$lib" -exec cp {} "install/$PRESET/testapp/lib/" \; 2>/dev/null || true
          done
          cp "$QT_PATH/plugins/platforms/libqxcb.so" "install/$PRESET/testapp/plugins/platforms/" 2>/dev/null || true
          cp "$QT_PATH/plugins/platforms/libqminimal.so" "install/$PRESET/testapp/plugins/platforms/" 2>/dev/null || true
          # Create wrapper script
          cat > "install/$PRESET/testapp/qtPilot-test-app.sh" << 'WRAPPER'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$DIR/plugins"
          exec "$DIR/qtPilot-test-app" "$@"
          WRAPPER
          chmod +x "install/$PRESET/testapp/qtPilot-test-app.sh"
          echo "Test app bundle size:"
          du -sh "install/$PRESET/testapp/"

      - name: Bundle test app (macOS)
        if: runner.os == 'macOS' && needs.plan.outputs.release == 'true'
        shell: bash
        run: |
          PRESET="${{ matrix.preset }}"
          QT_MAJOR=$(echo "${{ matrix.qt }}" | cut -c1)
          if [ -n "$QT_ROOT_DIR" ]; then
            QT_PATH="$QT_ROOT_DIR"
          elif [ -n "$Qt6_DIR" ]; then
            QT_PATH="$(cd "$Qt6_DIR/../../.." && pwd)"
          elif [ -n "$Qt5_DIR" ]; then
            QT_PATH="$(cd "$Qt5_DIR/../../.." && pwd)"
          fi
          mkdir -p "install/$PRESET/testapp"
          # Copy binary (flat, not .app bundle — CMake doesn't set MACOSX_BUNDLE for test app)
          cp "build/$PRESET/bin/qtPilot-test-app" "install/$PRESET/testapp/"
          cp "install/$PRESET/bin/qtPilot-launcher" "install/$PRESET/testapp/" 2>/dev/null || true
          for f in "install/$PRESET/lib/"libqtPilot-probe-*.dylib; do
            [ -f "$f" ] && cp "$f" "install/$PRESET/testapp/qtPilot-probe.dylib"
          done
          # Wrapper script (sets DYLD paths for Qt frameworks)
          cat > "install/$PRESET/testapp/qtPilot-test-app.sh" << 'WRAPPER'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export DYLD_FRAMEWORK_PATH="$DIR:${DYLD_FRAMEWORK_PATH:-}"
          export QT_PLUGIN_PATH="$DIR/plugins"
          exec "$DIR/qtPilot-test-app" "$@"
          WRAPPER
          chmod +x "install/$PRESET/testapp/qtPilot-test-app.sh"
          echo "Test app bundle size:"
          du -sh "install/$PRESET/testapp/"

      - name: Ad-hoc sign binaries (macOS)
        if: runner.os == 'macOS' && needs.plan.outputs.release == 'true'
        shell: bash
        run: |
          PRESET="${{ matrix.preset }}"
          codesign --sign - --force "install/$PRESET/bin/qtPilot-launcher" 2>/dev/null || true
          for f in "install/$PRESET/lib/"libqtPilot-probe-*.dylib; do
            [ -f "$f" ] && codesign --sign - --force "$f" || true
          done

      - name: Upload artifact
        if: needs.plan.outputs.release == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: qtpilot-${{ matrix.preset }}-qt${{ matrix.qt }}-${{ matrix.compiler }}${{ matrix.arch_label && format('-{0}', matrix.arch_label) || '' }}
          path: install/${{ matrix.preset }}

  python:
    needs: plan
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.python_matrix) }}
    name: python (${{ matrix.name }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # uv, not pip. `pip install -e .` re-resolves the dependency ranges on
      # every run, so a leg could pass against versions nobody had ever run.
      # --locked installs exactly what uv.lock pins -- including the sha256 of
      # every artifact -- and fails if the lock has drifted from pyproject.toml.
      # This matrix previously used pip, which would have silently reverted the
      # supply-chain enforcement already on main when this branch merged.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "python/uv.lock"

      - name: Install from the lockfile
        if: matrix.floor_sdk == ''
        working-directory: python
        run: uv sync --locked ${{ matrix.uv_extras }} --python ${{ matrix.python }}

      # The floor leg only. A fresh venv with everything resolved together, not
      # a downgrade of a synced one: dropping fastmcp across a major boundary
      # in place leaves the newer package's files behind, and the stale tree
      # then imports symbols the older `mcp` does not export. This leg is the
      # one place not pinned by uv.lock -- see the matrix comment above.
      - name: Install the floor SDK in a clean environment
        if: matrix.floor_sdk != ''
        working-directory: python
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]" "${{ matrix.floor_sdk }}"

      - name: Report resolved MCP stack
        working-directory: python
        run: uv run --no-sync python -c "import qtpilot._mcp_compat as c; print(c.describe())"

      - name: Assert MCP protocol revision
        if: matrix.expect_revision != ''
        working-directory: python
        env:
          EXPECTED: ${{ matrix.expect_revision }}
        run: |
          uv run --no-sync python - <<'PY'
          import os, sys
          import qtpilot._mcp_compat as c
          expected = os.environ["EXPECTED"]
          actual = c.protocol_revision()
          if actual != expected:
              sys.exit(
                  f"Expected MCP revision {expected}, got {actual} "
                  f"(fastmcp {c.fastmcp_version()})"
              )
          print(f"OK: {actual} via fastmcp {c.fastmcp_version()}")
          PY

      - name: Test
        working-directory: python
        run: uv run --no-sync pytest -v

  gate:
    name: Validation gate
    needs: [plan, lint, python, build, static-probe, mobile, sanitizers, benchmarks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Every selected check must have succeeded
        env:
          VALIDATION_PLAN: ${{ needs.plan.outputs.plan }}
          VALIDATION_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci_policy.py gate
