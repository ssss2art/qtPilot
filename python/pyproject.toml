[project]
name = "qtpilot"
dynamic = ["version"]
description = "MCP server for controlling Qt applications via qtPilot probe"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Scott Johnson"}
]
keywords = ["mcp", "qt", "automation", "testing", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # fastmcp.server.middleware (used by logging_middleware) requires >= 2.9.
    "fastmcp>=2.9,<3",
    # websockets.asyncio.client (used by connection) requires >= 13.
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://github.com/ssss2art/qtPilot"
Documentation = "https://github.com/ssss2art/qtPilot#readme"
Repository = "https://github.com/ssss2art/qtPilot"
Issues = "https://github.com/ssss2art/qtPilot/issues"
Changelog = "https://github.com/ssss2art/qtPilot/releases"

[project.scripts]
qtpilot = "qtpilot.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = ".."
# Building from a GitHub source tarball / `git archive` (no .git, no PKG-INFO)
# would otherwise hard-fail with "unable to detect version". Downstream
# packagers (conda-forge, distros) get this fallback; PyPI sdists still bake the
# real version into PKG-INFO.
raw-options.fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/qtpilot/_version.py"
