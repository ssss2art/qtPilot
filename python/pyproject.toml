[project]
name = "qtpilot"
dynamic = ["version"]
description = "MCP server for controlling Qt applications via qtPilot probe"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Scott Johnson"}
]
keywords = ["mcp", "qt", "automation", "testing", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # fastmcp.server.middleware (used by logging_middleware) requires >= 2.9.
    #
    # The range spans two MCP protocol revisions — FastMCP 2.x/3.x resolve an
    # `mcp` SDK advertising 2025-11-25, FastMCP 4 advertises the stateless
    # 2026-07-28. qtPilot supports both (see qtpilot/_mcp_compat.py). Pick one
    # explicitly with the `mcp-stable` / `mcp-next` extras below rather than
    # letting the resolver decide. See docs/MCP-CONFORMANCE.md.
    "fastmcp>=2.9,<5",
    # websockets.asyncio.client (used by connection) requires >= 13.
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
# Pin the MCP revision explicitly. These two extras are mutually exclusive.
#
#   mcp-stable -> MCP 2025-11-25 (FastMCP 2.x/3.x) — the conservative choice
#   mcp-next   -> MCP 2026-07-28 (FastMCP 4)       — stateless core
#
# Both extras resolve to stable releases; neither needs pre-releases enabled:
#   pip install 'qtpilot[mcp-next]'
#   uvx --from 'qtpilot[mcp-next]' qtpilot serve
#
# The floor is 4.0.1, the first stable 4.x -- deliberately not 4.0.0b1. Leaving
# a beta as the floor would let a resolver pick one over a shipped release.
mcp-stable = ["fastmcp<4"]
mcp-next = ["fastmcp>=4.0.1,<5"]

[tool.uv]
# mcp-stable and mcp-next pin opposite sides of the FastMCP 4 boundary, so they
# can never resolve together. Declaring the conflict lets uv lock each one
# separately instead of failing the whole resolution.
#
# There is deliberately no `mcp-legacy` extra for the 2.x floor. Adding one
# dragged the DEFAULT resolve down from FastMCP 4 to 2.14.7 and collapsed
# mcp-stable from 3.x to 2.x as well: extras are additive, so the base
# resolution must stay extendable by `fastmcp<3`, and declaring the conflict did
# not lift that. CI covers the 2.x floor by downgrading inside a synced env
# instead -- see the mcp-legacy leg in ci.yml.
conflicts = [
    [{ extra = "mcp-stable" }, { extra = "mcp-next" }],
]

[project.urls]
Homepage = "https://github.com/ssss2art/qtPilot"
Documentation = "https://github.com/ssss2art/qtPilot#readme"
Repository = "https://github.com/ssss2art/qtPilot"
Issues = "https://github.com/ssss2art/qtPilot/issues"
Changelog = "https://github.com/ssss2art/qtPilot/releases"

[project.scripts]
qtpilot = "qtpilot.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = ".."
# Building from a GitHub source tarball / `git archive` (no .git, no PKG-INFO)
# would otherwise hard-fail with "unable to detect version". Downstream
# packagers (conda-forge, distros) get this fallback; PyPI sdists still bake the
# real version into PKG-INFO.
raw-options.fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/qtpilot/_version.py"
